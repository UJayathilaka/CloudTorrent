services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: cloudtorrent-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Colombo
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./data/qbittorrent:/config
      - ./data/downloads:/downloads
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  api:
    build: .
    container_name: cloudtorrent-api
    env_file:
      - .env
    environment:
      - DOWNLOAD_DIR=/downloads
    volumes:
      - ./data/downloads:/downloads
    expose:
      - "8000"
    depends_on:
      - qbittorrent
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: cloudtorrent-caddy
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
