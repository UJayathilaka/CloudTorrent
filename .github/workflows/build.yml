name: Build CloudTorrent APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CloudTorrent-Android-Backend-Starter.zip'
      - 'android/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android starter
        run: unzip -o CloudTorrent-Android-Backend-Starter.zip -d /tmp/cloudtorrent-starter

      - name: Apply maintained Android source
        run: |
          cp -a android/app/src/main/java/. /tmp/cloudtorrent-starter/CloudTorrent/app/src/main/java/
          cp android/app/src/main/AndroidManifest.xml /tmp/cloudtorrent-starter/CloudTorrent/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: /tmp/cloudtorrent-starter/CloudTorrent
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudTorrent-APK
          path: /tmp/cloudtorrent-starter/CloudTorrent/app/build/outputs/apk/debug/app-debug.apk
