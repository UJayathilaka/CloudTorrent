
name: Build CloudTorrent APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CloudTorrent-Android-Backend-Starter.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o CloudTorrent-Android-Backend-Starter.zip -d .

      - name: Build APK
        working-directory: CloudTorrent
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudTorrent-APK
          path: CloudTorrent/app/build/outputs/apk/debug/app-debug.apk
