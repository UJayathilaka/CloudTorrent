name: Inspect Android Starter

on:
  push:
    paths:
      - '.github/workflows/inspect-starter.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect Android sources
        run: |
          unzip -o CloudTorrent-Android-Backend-Starter.zip -d /tmp/starter
          echo '--- PROJECT FILES ---'
          find /tmp/starter/CloudTorrent/app -maxdepth 8 -type f | sort
          echo '--- APP GRADLE ---'
          cat /tmp/starter/CloudTorrent/app/build.gradle.kts
          echo '--- MAIN ACTIVITY ---'
          cat /tmp/starter/CloudTorrent/app/src/main/java/com/vonko/cloudtorrent/MainActivity.kt
          echo '--- MANIFEST ---'
          cat /tmp/starter/CloudTorrent/app/src/main/AndroidManifest.xml
